# Frozen single-fold family-transfer pilot.
#
# BenchFlow/OpenHands uses an explicit provider prefix.  SkillGen meta calls
# use the provider-native model id and are routed to api.deepseek.com by
# SKILLGEN_CHAT_PROVIDER=deepseek (set by run_skillsbench_family.py).
models:
  default: "deepseek-v4-flash"
  baseline_agent: "deepseek/deepseek-v4-flash"
  baseline_judge: "deepseek-v4-flash"
  induction: "deepseek-v4-flash"
  induction_contextual: "deepseek-v4-flash"
  induction_summary: "deepseek-v4-flash"
  induction_pattern: "deepseek-v4-flash"
  induction_contrastive: "deepseek-v4-flash"
  generation_plan: "deepseek-v4-flash"
  generation_execute: "deepseek-v4-flash"
  refinement: "deepseek-v4-flash"
  verification_agent: "deepseek/deepseek-v4-flash"
  verification_judge: "deepseek-v4-flash"
  verification_case_analyst: "deepseek-v4-flash"
  verification_revision_synthesiser: "deepseek-v4-flash"

llm:
  temperature: 0.0
  max_tokens: 4096
  max_tokens_generation: 16384

# Kept unchanged for method fidelity.  DeepSeek does not provide an embedding
# API, so this small step still requires OPENAI_API_KEY.
embedding:
  model: "text-embedding-3-small"

clustering:
  method: "kmeans"
  n_clusters: null
  max_failure_clusters: 8
  max_success_clusters: 8
  min_clusters: 2
  target_cluster_size: 15
  min_cluster_size: 1

induction:
  max_contrastive_pairs: 20

generation:
  use_web_search: false
  max_search_queries: 0
  candidate_output_dir: "./candidates"
  generate_scripts: false
  max_failure_clusters_in_prompt: 6
  max_success_clusters_in_prompt: 6
  max_contrastive_pairs_in_prompt: 8

verification_analysis:
  case_analyst_workers: 3
  case_analyst_max_tokens: 2048
  revision_synthesiser_max_tokens: 4096

verification:
  sample_size: 10
  min_sample: 10
  seed: 42
  min_net_gain_abs: 2
  min_net_gain_rel: 0.0

router:
  enabled: false
  model: "deepseek-v4-flash"
  max_workers: 1

pipeline:
  max_refine_rounds: 8
  baseline_runs_per_instance: 1
  max_workers: 3
  artifact_root: "./artifacts/skillsbench-family/deepseek-v4-flash-pilot/runs"

skill_output:
  path: "./skill_output/skillsbench-family/deepseek-v4-flash-pilot"

experiment:
  provider: "deepseek_official"
  base_url: "https://api.deepseek.com"
  thinking_mode: "enabled_default_high"
  family_fold: "family-13__heldout__reserves-at-risk-calc"
  exhaustive_refinement_rounds: 8
  best_candidate_tie_break: "earliest_round"
  gate: "repair_count - regression_count >= 2 on n=10 verification slots"
  heldout_skill_execution: "conditional_on_active_gate"
  budget_cny: 120
  balance_stop_cny: 2
