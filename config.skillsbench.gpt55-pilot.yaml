# One-task paid pilot for the released SkillGen implementation on SkillsBench.
#
# Provider IDs intentionally differ by execution layer:
# - BenchFlow/OpenHands uses the explicit OpenRouter provider prefix.
# - SkillGen's own LLM wrapper already targets OpenRouter, so it receives the
#   native OpenRouter model slug without another provider prefix.
models:
  default: "openai/gpt-5.5"
  baseline_agent: "openrouter/openai/gpt-5.5"
  baseline_judge: "openai/gpt-5.5"
  induction: "openai/gpt-5.5"
  induction_contextual: "openai/gpt-5.5"
  induction_summary: "openai/gpt-5.5"
  induction_pattern: "openai/gpt-5.5"
  induction_contrastive: "openai/gpt-5.5"
  generation_plan: "openai/gpt-5.5"
  generation_execute: "openai/gpt-5.5"
  refinement: "openai/gpt-5.5"
  verification_agent: "openrouter/openai/gpt-5.5"
  verification_judge: "openai/gpt-5.5"
  verification_case_analyst: "openai/gpt-5.5"
  verification_revision_synthesiser: "openai/gpt-5.5"

llm:
  temperature: 0.0
  max_tokens: 4096
  max_tokens_generation: 16384

# The released implementation sends embeddings to OpenAI directly. Keeping
# this unchanged is part of the faithful-method pilot.
embedding:
  model: "text-embedding-3-small"

clustering:
  method: "kmeans"
  n_clusters: null
  max_failure_clusters: 8
  max_success_clusters: 8
  min_clusters: 2
  target_cluster_size: 15
  min_cluster_size: 1

induction:
  max_contrastive_pairs: 20

generation:
  use_web_search: false
  max_search_queries: 0
  candidate_output_dir: "./candidates"
  generate_scripts: false
  max_failure_clusters_in_prompt: 6
  max_success_clusters_in_prompt: 6
  max_contrastive_pairs_in_prompt: 8

verification_analysis:
  case_analyst_workers: 1
  case_analyst_max_tokens: 2048
  revision_synthesiser_max_tokens: 4096

# Preserve the released acceptance gate. The sample is clamped to the five
# frozen construction rollout slots by the original pipeline.
verification:
  sample_size: 120
  min_sample: 20
  seed: 42
  min_net_gain_abs: 3
  min_net_gain_rel: 0.05

router:
  enabled: false
  model: "openai/gpt-5.5"
  max_workers: 1

pipeline:
  # Paid pilot boundary: one generation/verification round only. No prompt,
  # induction, comparison, or gate logic is changed.
  max_refine_rounds: 1
  baseline_runs_per_instance: 1
  max_workers: 1
  artifact_root: "./artifacts/skillsbench/gpt55-pilot/runs"

skill_output:
  path: "./skill_output/skillsbench-gpt55-pilot"
